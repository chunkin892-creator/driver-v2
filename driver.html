<style>
:root{--bg:#0f0f0f;--card:#1c1c1e;--gold:#fc0;--blue:#0a84ff;--red:#ff453a;--green:#30d158;--purple:#bf5af2;--radius:16px}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{padding:12px;text-align:center;border-bottom:1px solid #333;flex-shrink:0;position:relative}
.title{font-size:24px;font-weight:800;color:var(--gold)}
.subtitle{font-size:13px;color:#888;margin-top:2px}
.global-voice-toggle{position:absolute;top:10px;right:10px;width:48px;height:48px;border-radius:50%;background:var(--green);border:none;color:#fff;font-size:24px;cursor:pointer}
.global-voice-toggle.muted{background:var(--red)}
.view{display:none;flex:1;overflow-y:auto;padding:12px;flex-direction:column}
.view.active{display:flex}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid #333}
.btn{width:100%;padding:16px;border-radius:14px;font-size:18px;font-weight:700;border:none;cursor:pointer;color:#fff;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{opacity:.8;transform:scale(.97)}
.btn:disabled{opacity:.4}
.btn-primary{background:#0a84ff}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.btn-warn{background:#ff9f0a;color:#000}
.btn-secondary{background:#3a3a3c}
.btn-outline{background:transparent;border:1px solid #555;color:#aaa}
.btn-sm{padding:8px 14px;font-size:13px;width:auto;display:inline-block;margin:0 4px 0 0}
.row{display:flex;gap:10px;margin-bottom:8px}
.row>*{flex:1}
.badge{display:inline-block;padding:6px 16px;border-radius:20px;font-weight:700;font-size:14px;margin:3px}
.badge-purple{background:var(--purple)}
.badge-red{background:var(--red)}
.big-number{font-size:52px;font-weight:800;text-align:center;color:var(--gold);margin:4px 0}
.station-name{font-size:28px;font-weight:700;text-align:center;color:var(--gold);margin:6px 0}
.msg-area{background:#1a1a1a;border-radius:12px;padding:10px;margin-top:8px}
.msg-list{max-height:180px;overflow-y:auto;margin-bottom:8px;font-size:14px}
.msg-row{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #333;flex-wrap:wrap}
.msg-input{flex:1;padding:12px;border-radius:10px;border:none;font-size:16px;background:#2c2c2e;color:#fff;min-width:80px}
.send-btn{width:52px;height:52px;border-radius:12px;border:none;background:var(--blue);color:#fff;font-size:16px;font-weight:700;cursor:pointer;flex-shrink:0}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 24px;border-radius:30px;font-size:16px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.modal.active{display:flex}
.modal-card{background:#1c1c1e;border:2px solid var(--gold);border-radius:20px;padding:24px;max-width:400px;width:100%}
.modal-card h2{color:var(--gold);margin-bottom:16px;font-size:24px;text-align:center}
.modal-card input{width:100%;padding:14px;margin:6px 0;border-radius:12px;border:none;font-size:18px;background:#2c2c2e;color:#fff}
.modal-card .btn{font-size:18px;padding:14px}
.route-strip{display:flex;overflow-x:auto;gap:12px;padding:14px 8px;border-top:2px solid #555;margin-top:10px;background:rgba(255,255,255,.05);border-radius:12px;min-height:70px;align-items:center}
.dot-node{flex:0 0 150px;text-align:center;font-size:15px;white-space:nowrap;padding:4px 0}
.dot{width:28px;height:28px;border-radius:50%;background:#444;margin:0 auto 4px;border:3px solid #666;transition:all .3s}
.dot-node.current .dot{background:#00ff66;border-color:#fff;box-shadow:0 0 20px #00ff66;transform:scale(1.15)}
.dot-node.current span{color:#fff;font-weight:800;font-size:17px}
.dot-node.next .dot{background:#00ff66;border-color:#fff;animation:blink .8s infinite}
.dot-node.next span{color:#00ff66;font-weight:700}
.dot-node.passed .dot{background:#666;opacity:.4}
.dot-node.passed span{color:#666}
@keyframes blink{50%{opacity:.4;transform:scale(.9)}}
@keyframes pulse{50%{opacity:.3}}
.play-audio{background:var(--blue);color:#fff;border:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.tab-bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab-btn{flex:1;min-width:80px;padding:12px 6px;background:#2c2c2e;border:none;color:#888;border-radius:10px;cursor:pointer;font-size:14px;font-weight:700}
.tab-btn.active{background:var(--blue);color:#fff}
.rec-controls{display:none;gap:6px;margin-top:8px}
.rec-controls button{flex:1;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.rec-stop{background:var(--green);color:#fff}
.rec-cancel{background:var(--red);color:#fff}
.rec-status{display:none;align-items:center;gap:8px;padding:8px;background:#1a1a1a;border-radius:8px;margin-top:8px;font-size:14px;color:#fc0}
.rec-dot{width:10px;height:10px;border-radius:50%;background:red;animation:pulse .6s infinite}
.booking-card{background:#1e293b;border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid #334155}
.booking-card.full{border-color:#ef4444;background:#450a0a}
.booking-card .time{font-size:24px;font-weight:900;color:#38bdf8}
.booking-card .info{font-size:12px;color:#94a3b8;margin-top:2px}
.booking-card .pickup{font-size:13px;color:#4ade80;margin-top:4px;font-weight:600}
.booking-card .counts{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.booking-card .seat-num{font-size:26px;font-weight:900;color:#22c55e}
.booking-card .seat-num.zero{color:#ef4444}
.pending-item{background:#0f172a;border-radius:8px;padding:10px;margin-bottom:6px;border-left:3px solid #fb923c}
.pending-item .name{font-size:15px;font-weight:700}
.pending-item .actions{display:flex;gap:6px;margin-top:8px}
.pending-item .actions button{flex:1;padding:8px;border:none;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer}
.btn-confirm{background:#22c55e;color:#fff}
.btn-reject{background:#ef4444;color:#fff}
.wake-lock-status{position:fixed;bottom:12px;left:12px;font-size:12px;color:#666;z-index:5;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:10px}
.connection-status{position:fixed;top:60px;left:50%;transform:translateX(-50%);padding:6px 20px;border-radius:20px;font-size:14px;z-index:100;display:none}
.connection-status.online{background:var(--green);color:#fff;display:block}
.connection-status.offline{background:var(--red);color:#fff;display:block}
.booking-notify-bar{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:460px;background:linear-gradient(135deg,#7c2d12,#c2410c);border:2px solid #fb923c;border-radius:14px;padding:14px;z-index:99999;display:none}
.booking-notify-bar.show{display:block}
</style>
</head>
<body>
<div class="header"><div class="title">🚐 西鐵小巴 · 司機版</div><div class="subtitle">浚鍵管理有限公司</div><button class="global-voice-toggle" id="global-voice-btn">🔊</button></div>
<div class="connection-status" id="connection-status"></div>
<div class="modal" id="login-modal"><div class="modal-card"><h2>🚏 司機登入</h2><input type="text" id="driver-identifier" placeholder="電郵 或 電話號碼"><button class="btn btn-green" id="driver-login-btn">確認登入</button><div id="driver-login-error" style="color:#ff453a;font-size:14px;margin-top:8px;text-align:center"></div></div></div>
<div id="view-driver" class="view active"><div id="driver-panel" style="display:flex;flex-direction:column;gap:10px;">
<div class="card" style="text-align:center;padding:14px;"><div style="font-size:16px;color:#aaa;" id="d-info">🚐 未登入 | 司機: -</div><div style="margin:8px 0;"><span class="badge badge-purple" id="d-mode-badge">西鐵快線</span><span class="badge badge-red" id="d-dir-badge">往元朗</span></div><div class="station-name" id="d-station">大棠黃泥墩</div><div id="d-target" style="font-size:18px;color:var(--gold);">下一站：大棠山路巴士站</div><div id="d-gps-status" style="font-size:14px;color:#888;margin-top:4px;">📍 GPS 定位中...</div></div>
<div class="card" style="text-align:center;padding:12px;"><div style="font-size:18px;color:#aaa;">目前乘客</div><div class="big-number" id="d-pass-count">0</div><div class="row"><button class="btn btn-green" id="btn-add-pass">＋ 乘客</button><button class="btn btn-red" id="btn-sub-pass">－ 乘客</button></div></div>
<div class="row"><button class="btn btn-primary" id="btn-prev">◀ 上一站</button><button class="btn btn-primary" id="btn-next">下一站 ▶</button></div>
<div class="row"><button class="btn btn-green" id="d-full-btn">🚫 滿座</button><button class="btn btn-secondary" id="d-car-btn">16座</button></div>
<div class="row"><button class="btn btn-secondary" id="btn-switch-dir">🔄 調頭</button><button class="btn" id="btn-mode-toggle" style="background:#bf5af2;color:#fff;">🔄 切換至市中心循環線</button></div>
<div class="row"><input id="driver-plate-input" placeholder="輸入車牌號碼" style="padding:14px;border-radius:12px;border:1px solid #444;background:#2c2c2e;color:#fff;font-size:16px;margin:0;flex:2;"><button class="btn btn-green" id="btn-set-plate" style="width:auto;flex:0 0 auto;padding:14px 20px;font-size:16px;margin:0;">設定</button></div>
<button class="btn btn-green" id="start-gps">🟢 開始當值 (GPS)</button>
<button class="btn btn-red" id="stop-gps" style="display:none;">🔴 停止當值</button>
<div class="route-strip" id="d-route-strip"></div>
<div class="tab-bar" style="margin-top:12px;"><button class="tab-btn active" id="driver-tab-booking">🎫 留位確認</button><button class="tab-btn" id="driver-tab-walkie">🎙️ 對講機</button><button class="tab-btn" id="driver-tab-msg">💬 訊息</button></div>
<div id="driver-panel-booking"><div id="driver-booking-content"><div style="text-align:center;color:#888;padding:20px;">載入中...</div></div></div>
<div id="driver-panel-walkie" style="display:none;"><div class="card" style="border:2px solid var(--gold);background:#2c1a3a;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><span style="font-size:18px;font-weight:bold;color:var(--gold);">🎙️ 對講機</span><span id="walkie-target-display" style="font-size:14px;color:#aaa;">廣播給：全部司機</span></div><div class="row"><select id="walkie-target" style="padding:12px;border-radius:10px;border:none;background:#2c2c2e;color:#fff;font-size:16px;"><option value="all">📢 全部司機</option></select><button class="btn btn-secondary" id="walkie-refresh-targets" style="width:auto;flex:0 0 auto;padding:12px 16px;">🔄</button></div><button class="btn btn-warn" id="btn-walkie-record">🎤 撳一下開始錄音</button><div id="walkie-record-controls" class="rec-controls"><button class="rec-stop" id="walkie-stop">✅ 發送</button><button class="rec-cancel" id="walkie-cancel">❌ 取消</button></div><div id="walkie-rec-status" class="rec-status"><div class="rec-dot"></div><span>錄音中... <span id="walkie-rec-time">0</span>s</span></div><div id="walkie-messages" style="max-height:200px;overflow-y:auto;background:#1a1a1a;border-radius:10px;padding:8px;margin-top:8px;font-size:14px;"></div></div></div>
<div id="driver-panel-msg" style="display:none;"><div class="msg-area"><div class="msg-list" id="driver-msg-list"></div><div class="msg-row"><input id="driver-msg-input" class="msg-input" placeholder="廣播訊息…"><button class="send-btn" id="btn-driver-send">發</button></div><button class="btn btn-warn" id="btn-driver-record" style="margin-top:8px;">🎤 撳一下開始錄音</button><div id="driver-record-controls" class="rec-controls"><button class="rec-stop" id="driver-stop">✅ 發送</button><button class="rec-cancel" id="driver-cancel">❌ 取消</button></div><div id="driver-rec-status" class="rec-status"><div class="rec-dot"></div><span>錄音中... <span id="driver-rec-time">0</span>s</span></div></div></div>

const RecorderManager={instances:{},create:function(id,onSend){if(this.instances[id])return this.instances[id];let mr=null,ms=null,chunks=[],timer=null,sec=0,isRec=false;const self={id};self.start=function(){if(isRec)return;isRec=true;navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{ms=stream;let rec;try{rec=new MediaRecorder(stream,{audioBitsPerSecond:CONFIG.VOICE_BITRATE,mimeType:'audio/webm;codecs=opus'});}catch(e){rec=new MediaRecorder(stream,{audioBitsPerSecond:CONFIG.VOICE_BITRATE});}mr=rec;chunks=[];mr.ondataavailable=e=>chunks.push(e.data);mr.onstop=()=>{if(ms){ms.getTracks().forEach(t=>t.stop());ms=null;}};mr.start();sec=0;const st=document.getElementById(id+'-rec-status');if(st)st.style.display='flex';const tm=document.getElementById(id+'-rec-time');if(tm)tm.textContent='0';timer=setInterval(()=>{sec++;if(tm)tm.textContent=sec;if(sec>=CONFIG.RECORD_MAX_SECONDS)self.stop();},1000);}).catch(()=>{showToast('❌ 無法開啟咪高峰');isRec=false;});};self.stop=function(){if(!isRec)return;isRec=false;if(timer){clearInterval(timer);timer=null;}if(mr&&mr.state==='recording'){mr.onstop=()=>{const blob=new Blob(chunks,{type:'audio/webm'});const reader=new FileReader();reader.onload=()=>{const b64=reader.result.split(',')[1];if(onSend)onSend(b64);if(ms){ms.getTracks().forEach(t=>t.stop());ms=null;}};reader.readAsDataURL(blob);};mr.stop();}const st=document.getElementById(id+'-rec-status');if(st)st.style.display='none';};self.cancel=function(){if(!isRec)return;isRec=false;if(timer){clearInterval(timer);timer=null;}if(mr&&mr.state==='recording'){mr.onstop=()=>{if(ms){ms.getTracks().forEach(t=>t.stop());ms=null;}};mr.stop();}const st=document.getElementById(id+'-rec-status');if(st)st.style.display='none';showToast('❌ 錄音已取消');};self.isRecording=()=>isRec;this.instances[id]=self;return self;},get:function(id){return this.instances[id];}};
function setupRecorderUI(id,onSend){const btn=document.getElementById('btn-'+id+'-record');const ctrl=document.getElementById(id+'-record-controls');const stopBtn=document.getElementById(id+'-stop');const cancelBtn=document.getElementById(id+'-cancel');if(!btn)return;RecorderManager.create(id,onSend);btn.addEventListener('click',()=>{const r=RecorderManager.get(id);if(r.isRecording())return;r.start();if(ctrl)ctrl.style.display='flex';btn.style.display='none';});if(stopBtn)stopBtn.addEventListener('click',()=>{const r=RecorderManager.get(id);if(r&&r.isRecording())r.stop();if(ctrl)ctrl.style.display='none';btn.style.display='block';});if(cancelBtn)cancelBtn.addEventListener('click',()=>{const r=RecorderManager.get(id);if(r&&r.isRecording())r.cancel();if(ctrl)ctrl.style.display='none';btn.style.display='block';});}

function startGpsWatch(){if(gpsWatchId){navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null;}if(gpsRetryTimer){clearTimeout(gpsRetryTimer);gpsRetryTimer=null;}const gs=document.getElementById('d-gps-status');if(gs)gs.textContent='📍 GPS 定位中⋯';let ff=false;gpsFirstFix=false;lastPos=null;lastPosTime=0;positionBuffer=[];pendingStationIdx=-1;pendingStationCount=0;gpsWatchId=navigator.geolocation.watchPosition(pos=>{if(pos.coords.accuracy>CONFIG.GPS_ACCURACY_THRESHOLD){if(gs)gs.textContent='⚠️ GPS 精度不足 ('+Math.round(pos.coords.accuracy)+'m)';return;}if(!ff){ff=true;gpsFirstFix=true;if(gpsRetryTimer){clearTimeout(gpsRetryTimer);gpsRetryTimer=null;}showToast('✅ GPS 已定位');if(gs)gs.textContent='📍 GPS 已定位';}if(!driverData.isActive||!driverData.plate)return;const n=nowMs();if(n-lastGpsProcessTime<1000)return;lastGpsProcessTime=n;positionBuffer.push({lat:pos.coords.latitude,lng:pos.coords.longitude});if(positionBuffer.length>CONFIG.SMOOTHING_WINDOW)positionBuffer.shift();let aL=0,aLn=0;positionBuffer.forEach(p=>{aL+=p.lat;aLn+=p.lng;});aL/=positionBuffer.length;aLn/=positionBuffer.length;let sp=0;if(lastPos){const dt=(n-lastPosTime)/1000;if(dt>0)sp=calcDistance(lastPos.lat,lastPos.lng,pos.coords.latitude,pos.coords.longitude)/dt;}lastPos={lat:pos.coords.latitude,lng:pos.coords.longitude};lastPosTime=n;const co=getCoords(),rt=getRoute();if(!co||!co.length)return;let mD=Infinity,nI=0;for(let x=0;x<co.length;x++){const d=calcDistance(aL,aLn,co[x].lat,co[x].lng);if(d<mD){mD=d;nI=x;}}if(gs)gs.textContent='📍 '+rt[nI]+' ('+Math.round(mD)+'m) · '+sp.toFixed(1)+'m/s';if(mD<CONFIG.TRIGGER_DISTANCE&&nI>lastReportedIndex){if(sp<CONFIG.MIN_SPEED_FOR_TRIGGER)return;if(pendingStationIdx===nI){pendingStationCount++;}else{pendingStationIdx=nI;pendingStationCount=1;}if(pendingStationCount<2)return;pendingStationIdx=-1;pendingStationCount=0;lastReportedIndex=nI;driverData.stationIndex=nI;updateDriverDB();renderDriverRouteStrip();const sN=rt[nI],nX=nI+1,nsn=nX<rt.length?rt[nX]:null;if(voic function switchDriverTab(tab){const btns={booking:document.getElementById('driver-tab-booking'),walkie:document.getElementById('driver-tab-walkie'),msg:document.getElementById('driver-tab-msg')};const panels={booking:document.getElementById('driver-panel-booking'),walkie:document.getElementById('driver-panel-walkie'),msg:document.getElementById('driver-panel-msg')};Object.keys(btns).forEach(k=>{if(btns[k])btns[k].className='tab-btn'+(k===tab?' active':'');if(panels[k])panels[k].style.display=k===tab?'block':'none';});if(tab==='booking')startDriverBookingListeners();if(tab==='walkie')initWalkieTalkie();}
function renderDriverBookingContent(){const c=document.getElementById('driver-booking-content');if(!c)return;const t=getToday(),bk=currentCachedBookings,sc=currentCachedBookings._sc||{};let h='<button class="btn btn-outline btn-sm" onclick="renderDriverBookingContent()" style="margin-bottom:10px;">🔄 重新整理</button>';h+='<div style="font-size:16px;font-weight:700;color:#38bdf8;margin-bottom:8px;">📋 固定班次</div>';const allS=['06:20','06:30','06:40','06:50','18:15','18:30','18:45','19:00','19:15','19:30','19:45','20:00','20:20'];let hasAny=false;allS.forEach(tm=>{const sid=t+'_'+tm.replace(':','');const cfg=sc[tm.replace(':','')];const quota=(cfg&&(cfg.quota||cfg.seats))||16;const dir=parseInt(tm.split(':')[0])<12?'morning':'evening';const sb=Object.keys(bk).filter(k=>k!=='_sc').map(k=>bk[k]).filter(b=>b&&b.scheduleId===sid&&b.status!=='cancelled');const used=sb.filter(b=>['pending','reserved','arrived','boarded'].indexOf(b.status)>=0).reduce((s,b)=>s+(b.seats||0),0);const rem=quota-used;const full=rem<=0;const pl=sb.filter(b=>b.status==='pending');const cl=sb.filter(b=>b.status==='reserved');const al=sb.filter(b=>b.status==='arrived'||b.status==='boarded');if(pl.length===0&&cl.length===0&&al.length===0)return;hasAny=true;h+='<div class="booking-card'+(full?' full':'')+'"><div class="time">'+esc(tm)+'</div><div class="info" style="color:'+(dir==='morning'?'#4ade80':'#fdba74')+';font-weight:700;">'+(dir==='morning'?'🌅 大棠黃泥墩開出':'🌆 元朗港鐵站 H 出口開出')+'</div><div class="counts"><div><div style="font-size:13px;color:#fdba74;">⏳ '+pl.length+' 待確認</div><div style="font-size:13px;color:#4ade80;margin-top:2px;">🔴 '+al.length+' 已到 · ✅ '+cl.length+' 已確認</div></div><div style="text-align:right;"><div class="seat-num'+(rem<=0?' zero':'')+'">'+rem+'</div><div style="font-size:11px;color:#64748b;">剩餘 / '+quota+'</div></div></div>';if(pl.length>0){h+='<div style="background:#1c1917;border:2px solid #fb923c;border-radius:10px;padding:10px;margin-top:10px;"><div style="font-size:13px;font-weight:700;color:#fdba74;margin-bottom:6px;">🔔 待確認（'+pl.length+'）</div>';pl.forEach(b=>{const bt=b.createdAt?new Date(b.createdAt).toLocaleString('zh-HK',{hour:'2-digit',minute:'2-digit',hour12:false}):'';h+='<div class="pending-item"><div class="name">'+esc(b.passengerName)+(b.seats>1?' ×'+b.seats:'')+'</div><div style="font-size:12px;color:#94a3b8;margin-top:2px;">📞 '+esc(b.passengerPhone)+'</div>'+(b.pickupLocation?'<div class="pickup">📍 '+esc(b.pickupLocation)+'</div>':'<div class="pickup" style="color:#f87171;">📍 未填</div>')+(bt?'<div style="font-size:11px;color:#64748b;margin-top:4px;">⏰ '+bt+'</div>':'')+'<div class="actions"><button class="btn-confirm" onclick="driverConfirm(\''+b.date+'\',\''+b.id+'\',\''+esc(driverData.plate||'')+'\')">✅ 確認</button><button class="btn-reject" onclick="driverReject(\''+b.date+'\',\''+b.id+'\')">❌ 拒絕</button></div></div>';});h+='</div>';}const allC=al.concat(cl);if(allC.length>0){h+='<div style="margin-top:10px;">';allC.forEach(b=>{const tr=currentPassengerTracking[b.id];let g='';if(tr&&tr.updatedAt&&(nowMs()-tr.updatedAt<120000)){g=tr.arrived?'<div style="font-size:12px;color:#4ade80;margin-top:4px;font-weight:600;">🟢 已到站（'+Math.round(tr.distance)+' 米）</div>':'<div style="font-size:12px;color:#fbbf24;margin-top:4px;font-weight:600;">🟡 前往中（'+Math.round(tr.distance)+' 米）</div>';}else if(b.arrivedAuto||b.arrivedAt){g='<div style="font-size:12px;color:#4ade80;margin-top:4px;font-weight:600;">🟢 已到站</div>';}else{g='<div style="font-size:12px;color:#94a3b8;margin-top:4px;font-weight:600;">⚪ 等待 GPS...</div>';}h+='<div style="background:#0f172a;border-radius:8px;padding:10px;margin-bottom:6px;border-left:3px solid #22c55e;"><div class="name">'+esc(b.passengerName)+(b.seats>1?' ×'+b.seats:'')+'</div><div style="font-size:12px;color:#94a3b8;margin-top:2px;">📞 '+esc(b.passengerPhone)+'</div>'+(b.pickupLocation?'<div class="pickup">📍 '+esc(b.pickupLocation)+'</div>':'')+g+'</div>';});h+='</div>';}h+='</div>';});if(!hasAny)h+='<div style="text-align:center;color:#64748b;padding:16px;">暫無固定班次預約</div>';h+='<div style="font-size:16px;font-weight:700;color:#7dd3fc;margin:14px 0 8px;">🔄 循環線留位</div>';const lp=Object.keys(currentCachedLoop).map(k=>currentCachedLoop[k]).filter(x=>x&&x.status==='pending');const lr=Object.keys(currentCachedLoop).map(k=>currentCachedLoop[k]).filter(x=>x&&x.status==='reserved');if(lp.length===0&&lr.length===0){h+='<div style="text-align:center;color:#64748b;padding:16px;font-size:14px;">暫無循環線留位</div>';}else{if(lp.length>0){h+='<div style="background:#1c1917;border:2px solid #fb923c;border-radius:10px;padding:10px;"><div style="font-size:13px;font-weight:700;color:#fdba74;margin-bottom:6px;">🔔 待確認（'+lp.length+'）</div>';lp.forEach(x=>{const bt=x.createdAt?new Date(x.createdAt).toLocaleString('zh-HK',{hour:'2-digit',minute:'2-digit',hour12:false}):'';h+='<div class="pending-item"><div class="name">'+esc(x.name)+'</div><div style="font-size:12px;color:#94a3b8;margin-top:2px;">📞 '+esc(x.phone)+'</div>'+(x.pickupLocation?'<div class="pickup">📍 '+esc(x.pickupLocation)+'</div>':'')+(bt?'<div style="font-size:11px;color:#64748b;margin-top:4px;">⏰ '+bt+'</div>':'')+'<div class="actions"><button class="btn-confirm" onclick="driverConfirmLoop(\''+x.id+'\')">✅ 確認</button><button class="btn-reject" onclick="driverRejectLoop(\''+x.id+'\')">❌ 拒絕</button></div></div>';});h+='</div>';}if(lr.length>0){h+='<div style="margin-top:10px;">';lr.forEach(x=>{h+='<div style="background:#0f172a;border-radius:8px;padding:10px;margin-bottom:6px;border-left:3px solid #22c55e;"><div class="name">'+esc(x.name)+'</div><div style="font-size:12px;color:#94a3b8;margin-top:2px;">📞 '+esc(x.phone)+'</div>'+(x.pickupLocation?'<div class="pickup">📍 '+esc(x.pickupLocation)+'</div>':'')+'</div>';});h+='</div>';}}c.innerHTML=h;}
async function startDriverBookingListeners(){const t=getToday();if(driverBookingListener){try{driverBookingListener.off();}catch(e){}}if(driverLoopListener){try{driverLoopListener.off();}catch(e){}}const sc=await db.ref('booking_seats/'+t).once('value').then(s=>s.val()||{});currentCachedBookings._sc=sc;const init=await db.ref('booking/'+t).once('value').then(s=>s.val()||{});Object.keys(init).forEach(k=>{currentCachedBookings[k]=init[k];driverKnownBookingIds.add(k);});const li=await db.ref('booking_loop/'+t).once('value').then(s=>s.val()||{});Object.keys(li).forEach(k=>{currentCachedLoop[k]=li[k];driverKnownLoopIds.add(k);});driverFirstLoad=false;renderDriverBookingContent();const r=db.ref('booking/'+t);driverBookingListener=r.on('value',snap=>{const ab=snap.val()||{};currentPassengerTracking={};Object.keys(ab).forEach(k=>{const b=ab[k];if(b&&b.passengerLocation)currentPassengerTracking[k]=b.passengerLocation;});if(!driverFirstLoad){let np=0;Object.keys(ab).forEach(k=>{if(!driverKnownBookingIds.has(k)){const b=ab[k];if(b&&b.status==='pending')np++;}});if(np>0){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;g.gain.value=0.3;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+0.15);setTimeout(()=>{const o2=ctx.createOscillator(),g2=ctx.createGain();o2.frequency.value=1320;g2.gain.value=0.3;o2.connect(g2);g2.connect(ctx.destination);o2.start();o2.stop(ctx.currentTime+0.15);},200);}catch(e){}if(navigator.vibrate)navigator.vibrate([300,100,300]);showToast('🔔 有 '+np+' 個新預約！',4000);}}driverKnownBookingIds=new Set(Object.keys(ab));driverFirstLoad=false;const sc2=currentCachedBookings._sc;currentCachedBookings=Object.assign({},ab,{_sc:sc2});renderDriverBookingContent();});const rl=db.ref('booking_loop/'+t);driverLoopListener=rl.on('value',snap=>{currentCachedLoop=snap.val()||{};renderDriverBookingContent();});}
async function driverConfirm(date,id,plate){try{const bs=await db.ref('booking/'+date).once('value').then(s=>s.val()||{});const b=bs[id];if(!b){showToast('預約唔存在');return;}await db.ref('booking/'+date+'/'+id).update({status:'reserved',confirmedAt:nowMs(),confirmedBy:plate});if(plate){await db.ref('van/active_buses/'+plate+'/passengerCount').transaction(c=>(c||0)+(b.seats||1));}showToast('✅ 已確認留位',2000);}catch(e){showToast('❌ '+e.message);}}
async function driverReject(date,id){const r=prompt('拒絕原因（可留空）：','')||'';try{await db.ref('booking/'+date+'/'+id).update({status:'rejected',rejectedAt:nowMs(),rejectReason:r});await db.ref('booking/'+date+'/'+id+'/passengerLocation').remove();showToast('❌ 已拒絕',2000);}catch(e){showToast('❌ '+e.message);}}
async function driverConfirmLoop(id){try{const t=getToday();await db.ref('booking_loop/'+t+'/'+id).update({status:'reserved',confirmedAt:nowMs()});showToast('✅ 已確認留位',2000);}catch(e){showToast('❌ '+e.message);}}
async function driverRejectLoop(id){if(!confirm('確定拒絕？'))return;try{const t=getToday();await db.ref('booking_loop/'+t+'/'+id).remove();showToast('❌ 已拒絕',2000);}catch(e){showToast('❌ '+e.message);}}
function initWalkieTalkie(){if(!driverData.plate)return;updateWalkieTargets();if(walkieRef){try{walkieRef.off();}catch(e){}}walkieRef=db.ref('van/walkie_talkie').orderByChild('timestamp').limitToLast(50);walkieRef.on('value',s=>{const c=document.getElementById('walkie-messages');if(!c)return;c.innerHTML='';const items=[];s.forEach(ch=>{const m=ch.val();if(m.hidden)return;if(m.target==='all'||m.target===driverData.plate||m.senderPlate===driverData.plate)items.push({key:ch.key,msg:m});});items.sort((a,b)=>b.msg.timestamp-a.msg.timestamp);items.forEach(it=>{const m=it.msg,div=document.createElement('div');div.style.cssText='padding:4px 0;border-bottom:1px solid #333;font-size:14px;';const tS=document.createElement('span');tS.style.color='#888';tS.textContent='['+new Date(m.timestamp).toLocaleTimeString('zh-HK')+'] ';div.appendChild(tS);const st=document.createElement('strong');st.textContent=(m.senderPlate||'未知')+': ';div.appendChild(st);if(m.audio){const b=document.createElement('button');b.className='play-audio';b.textContent='▶ 語音';b.addEventListener('click',()=>playBoostedAudio(m.audio));div.appendChild(b);}else{div.appendChild(document.createTextNode(m.text||''));}c.appendChild(div);});});}
function updateWalkieTargets(){const s=document.getElementById('walkie-target');if(!s)return;db.ref('van/active_buses').once('value',snap=>{const d=snap.val()||{};let h='<option value="all">📢 全部司機</option>';Object.keys(d).forEach(p=>{if(p!==driverData.plate&&nowMs()-d[p].lastUpdate<CONFIG.ACTIVE_BUS_TIMEOUT)h+='<option value="'+esc(p)+'">🚐 '+esc(p)+'</option>';});s.innerHTML=h;});}
function initDriverPanel(){const sp=(()=>{try{const d=JSON.parse(localStorage.getItem('savedPlates')||'{}');return d[currentUser.identifier]||null;}catch(e){return null;}})();if(sp&&!driverData.plate){driverData.plate=sp;const i=document.getElementById('driver-plate-input');if(i)i.value=sp;}if(driverMsgRef){try{driverMsgRef.off();}catch(e){}driverMsgRef=null;}if(driverBusRef){try{driverBusRef.off();}catch(e){}driverBusRef=null;}if(driverData.plate){driverBusRef=db.ref('van/active_buses/'+driverData.plate);driverBusRef.on('value',s=>{const d=s.val();if(d){driverData.mode=d.mode||'busy';driverData.direction=d.direction||0;driverData.stationIndex=d.stationIndex||0;driverData.passengerCount=d.passengerCount||0;driverData.isActive=d.isActive||false;driverData.carSeats=d.carSeats||16;driverData.isFull=d.isFull||false;updateDriverUI();}});}driverMsgRef=db.ref('van/messages').orderByChild('busId').equalTo(driverData.plate||'');driverMsgRef.on('value',s=>{const el=document.getElementById('driver-msg-list');if(!el)return;el.innerHTML='';const items=[];s.forEach(c=>{const m=c.val();if(m.hidden)return;items.push({key:c.key,msg:m});});items.sort((a,b)=>b.msg.timestamp-a.msg.timestamp);items.forEach(it=>{const m=it.msg,div=document.createElement('div');div.className='msg-row';const tS=document.createElement('span');tS.style.color='#888';tS.style.fontSize='12px';tS.textContent=m.timestamp?'['+new Date(m.timestamp).toLocaleTimeString('zh-HK')+'] ':'';div.appendChild(tS);if(m.audio){const b=document.createElement('button');b.className='play-audio';b.textContent='▶ 語音';b.addEventListener('click',()=>playBoostedAudio(m.audio));div.appendChild(b);const sp2=document.createElement('span');sp2.textContent='🎤 語音訊息';div.appendChild(sp2);}else{div.appendChild(document.createTextNode((m.senderIdentifier||'')+': '+(m.text||'(訊息)')));}el.appendChild(div);});});updateDriverUI();const sg=document.getElementById('start-gps');if(sg)sg.style.display=driverData.isActive?'none':'block';const stg=document.getElementById('stop-gps');if(stg)stg.style.display=driverData.isActive?'block':'none';if(driverData.isActive&&driverData.plate&&!gpsWatchId)startGpsWatch();switchDriverTab('booking');}
document.getElementById('driver-login-btn').addEventListener('click',async function(){const id=document.getElementById('driver-identifier').value.trim();const er=document.getElementById('driver-login-error');if(!id){er.textContent='請輸入電郵或電話號碼';return;}er.textContent='';try{await auth.signInAnonymously();const uid=auth.currentUser.uid;let role='passenger';const dQ=await db.ref('drivers').orderByChild('identifier').equalTo(id).once('value');if(dQ.exists())role='driver';const aQ=await db.ref('admins').orderByChild('identifier').equalTo(id).once('value');if(aQ.exists())role='admin';if(role!=='driver'&&role!=='admin'){er.textContent='此帳戶不是司機，請聯絡管理員';return;}currentUser.uid=uid;currentUser.identifier=id;currentUser.role=role;await db.ref('users/'+uid).set({identifier:id,role,lastLogin:nowMs()});document.getElementById('login-modal').classList.remove('active');showToast('✅ 司機登入成功：'+id);if(voiceEnabled)speakCantonese(VOICE_TEXTS.welcomeDriver);initDriverPanel();}catch(e){er.textContent='登入失敗：'+e.message;}});
document.getElementById('btn-logout').addEventListener('click',function(){if(gpsWatchId){navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null;}if(gpsRetryTimer){clearTimeout(gpsRetryTimer);gpsRetryTimer=null;}releaseWakeLock();try{if(driverMsgRef)driverMsgRef.off();if(driverBusRef)driverBusRef.off();if(walkieRef)walkieRef.off();if(driverBookingListener)driverBookingListener.off();if(driverLoopListener)driverLoopListener.off();}catch(e){}if(driverData.plate)db.ref('van/active_buses/'+driverData.plate).remove().catch(()=>{});auth.signOut().catch(()=>{});currentUser={uid:null,identifier:null,role:'driver'};resetDriverData(false);document.getElementById('login-modal').classList.add('active');showToast('已登出');});
document.getElementById('btn-set-plate').addEventListener('click',function(){const i=document.getElementById('driver-plate-input');const p=i.value.trim().toUpperCase();if(!p){showToast('請輸入車牌號碼');return;}if(driverData.isActive){if(!confirm('你正在當值中，更改車牌會停止當值並清除數據，確定繼續？'))return;stopDuty();}driverData.plate=p;try{const d=JSON.parse(localStorage.getItem('savedPlates')||'{}');d[currentUser.identifier]=p;localStorage.setItem('savedPlates',JSON.stringify(d));}catch(e){}updateDriverDB();i.value='';showToast('✅ 車牌已設定：'+p);if(voiceEnabled)speakCantonese(VOICE_TEXTS.carPlateSet);});
document.getElementById('start-gps').addEventListener('click',startDuty);
document.getElementById('stop-gps').addEventListener('click',stopDuty);
document.getElementById('btn-prev').addEventListener('click',goToPrevStation);
document.getElementById('btn-next').addEventListener('click',goToNextStation);
document.getElementById('btn-add-pass').addEventListener('click',function(){if(!driverData.isActive){showToast('請先開始當值');return;}if(driverData.passengerCount>=driverData.carSeats){showToast('已達 '+driverData.carSeats+' 座上限');return;}driverData.passengerCount++;if(driverData.passengerCount===driverData.carSeats)driverData.isFull=true;updateDriverDB();});
document.getElementById('btn-sub-pass').addEventListener('click',function(){if(!driverData.isActive){showToast('請先開始當值');return;}if(driverData.passengerCount>0){driverData.passengerCount--;if(driverData.passengerCount<driverData.carSeats)driverData.isFull=false;updateDriverDB();}});
document.getElementById('d-full-btn').addEventListener('click',function(){if(!driverData.isActive){showToast('請先開始當值');return;}driverData.isFull=!driverData.isFull;if(driverData.isFull)driverData.passengerCount=driverData.carSeats;else driverData.passengerCount=Math.max(0,driverData.carSeats-1);updateDriverDB();});
document.getElementById('d-car-btn').addEventListener('click',function(){driverData.carSeats=driverData.carSeats===16?19:16;if(driverData.passengerCount>driverData.carSeats)driverData.passengerCount=driverData.carSeats;driverData.isFull=driverData.passengerCount===driverData.carSeats;updateDriverDB();});
document.getElementById('btn-switch-dir').addEventListener('click',function(){if(!driverData.isActive){showToast('請先開始當值');return;}driverData.direction=driverData.direction===0?1:0;driverData.stationIndex=0;lastReportedIndex=-1;lastDriverScrollIndex=-1;if(gpsWatchId){navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null;}startGpsWatch();updateDriverDB();renderDriverRouteStrip();if(voiceEnabled)speakCantonese(VOICE_TEXTS.turnAround);});
document.getElementById('btn-mode-toggle').addEventListener('click',function(){if(!driverData.isActive){showToast('請先開始當值');return;}driverData.mode=driverData.mode==='busy'?'normal':'busy';driverData.stationIndex=0;lastReportedIndex=-1;lastDriverScrollIndex=-1;updateDriverDB();renderDriverRouteStrip();const mn=driverData.mode==='busy'?VOICE_TEXTS.modeBusy:VOICE_TEXTS.modeNormal;showToast('已切換至 '+mn);if(voiceEnabled)speakCantonese(VOICE_TEXTS.switchedTo+mn);});
document.getElementById('driver-tab-booking').addEventListener('click',()=>switchDriverTab('booking'));
document.getElementById('driver-tab-walkie').addEventListener('click',()=>switchDriverTab('walkie'));
document.getElementById('driver-tab-msg').addEventListener('click',()=>switchDriverTab('msg'));
document.getElementById('btn-driver-send').addEventListener('click',function(){const i=document.getElementById('driver-msg-input');const t=i?i.value.trim():'';if(!t||!driverData.plate)return;db.ref('van/messages').push({busId:driverData.plate,senderUid:currentUser.uid,senderIdentifier:currentUser.identifier,text:t,timestamp:nowMs(),type:'text'}).then(()=>{i.value='';showToast('已廣播');});});
document.getElementById('walkie-refresh-targets').addEventListener('click',updateWalkieTargets);
document.getElementById('global-voice-btn').addEventListener('click',function(){voiceEnabled=!voiceEnabled;this.textContent=voiceEnabled?'🔊':'🔇';this.classList.toggle('muted',!voiceEnabled);showToast(voiceEnabled?'語音已開啟':'語音已關閉');try{localStorage.setItem('globalVoice',voiceEnabled?'on':'off');}catch(e){}if(!voiceEnabled&&window.speechSynthesis)window.speechSynthesis.cancel();});
if(localStorage.getItem('globalVoice')==='off'){voiceEnabled=false;const b=document.getElementById('global-voice-btn');if(b){b.textContent='🔇';b.classList.add('muted');}}
setupRecorderUI('walkie',function(b64){const ts=document.getElementById('walkie-target');const t=ts?ts.value:'all';if(!driverData.plate){showToast('請先設定車牌');return;}db.ref('van/walkie_talkie').push({senderUid:currentUser.uid,senderIdentifier:currentUser.identifier,senderPlate:driverData.plate,target:t,audio:b64,timestamp:nowMs(),type:'walkie_audio'}).then(()=>showToast('✅ 對講機已發送'));});
setupRecorderUI('driver',function(b64){if(!driverData.plate)return;db.ref('van/messages').push({busId:driverData.plate,senderUid:currentUser.uid,senderIdentifier:currentUser.identifier,audio:b64,timestamp:nowMs(),type:'audio'}).then(()=>showToast('✅ 語音已發送'));});
db.ref('.info/connected').on('value',snap=>{const s=document.getElementById('connection-status');if(!s)return;if(snap.val()){s.textContent='🟢 已連線';s.className='connection-status online';setTimeout(()=>{s.style.display='none';},2500);}else{s.textContent='🔴 網絡中斷';s.className='connection-status offline';s.style.display='block';}});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&driverData.isActive){if(!gpsWatchId||gpsRestartNeeded){gpsRestartNeeded=false;if(gpsWatchId){navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null;}startGpsWatch();}}if(!document.hidden&&driverData.isActive&&!wakeLock)requestWakeLock();});
auth.onAuthStateChanged(function(user){if(user){db.ref('users/'+user.uid).once('value').then(snap=>{const d=snap.val();if(d&&(d.role==='driver'||d.role==='admin')){currentUser.uid=user.uid;currentUser.identifier=d.identifier||'';currentUser.role=d.role;document.getElementById('login-modal').classList.remove('active');initDriverPanel();}});}else{document.getElementById('login-modal').classList.add('active');}});
window.hideBookingNotify=function(){const b=document.getElementById('booking-notify-bar');if(b)b.classList.remove('show');};
window.driverConfirm=driverConfirm;
window.driverReject=driverReject;
window.driverConfirmLoop=driverConfirmLoop;
window.driverRejectLoop=driverRejectLoop;
window.renderDriverBookingContent=renderDriverBookingContent;
console.log('✅ 司機版 v1.0 已就緒');
</script>
</body>
